<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>
@if (isLoading) {
  <ion-spinner name="crescent"></ion-spinner>
}

<ion-content>
  <app-form
    [fields]="loginFields"
    [errors]="errors"
    [defaultButton]="false"
    submitText="Ingresar"
    (submitForm)="onLogin($event)">
    <ion-button [routerLink]="['/sign-in']" expand="block" color="medium">Crear cuenta</ion-button>
  </app-form>
  
</ion-content>
