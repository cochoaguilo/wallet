<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>
@if (isLoading()) {
  <ion-spinner name="crescent"></ion-spinner>
} @else {
  <ion-content>
    <app-form
      [fields]="loginFields"
      [errors]="errors"
      [defaultButton]="false"
      submitText="Ingresar"
      (submitForm)="onLogin($event)">
      <ion-button [routerLink]="['/sign-in']" expand="block" color="medium">Crear cuenta</ion-button>
      <app-google-button text="signin_with" (credential)="onGoogleLogin($event)"></app-google-button>
    </app-form>
    
  </ion-content>
}
