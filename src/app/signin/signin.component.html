<ion-header>
  <ion-toolbar>
    <ion-title>Crear usuario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-form
    [fields]="registerFields"
    (submitForm)="onRegister($event)">
  </app-form>
  <ion-card>
    <ion-card-content>
      <app-google-button text="signup_with" (credential)="onGoogleSignUp($event)"></app-google-button>
    </ion-card-content>
  </ion-card>
</ion-content>
