<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Deudas
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Deudas</ion-title>
    </ion-toolbar>
  </ion-header>
<ion-button expand="block" color="primary" (click)="mostrarFormulario = !mostrarFormulario">
    {{ mostrarFormulario ? 'Cancelar' : 'Agregar deuda' }}
  </ion-button>
  <app-form
    *ngIf="mostrarFormulario"
    [fields]="formFields"
    (submitForm)="agregarDeuda($event)"
    (cancelar)="mostrarFormulario = false">
  </app-form>

  <ion-list>
    <ion-item *ngFor="let deuda of deudas">
      <ion-label>
        <strong>{{ deuda.nombre }}</strong><br>
        {{ deuda.descripcion }}<br>
        Monto: {{ deuda.monto | currency:'USD' }}<br>
        Fecha: {{ deuda.fecha | date:'dd/MM/yyyy' }}<br>
        Interés: {{ deuda.interes }}% ({{ deuda.tipoInteres | titlecase }})
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
